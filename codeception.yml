namespace: SprykerEcoTest
actor: Tester

include:
    - tests/SprykerEcoTest/Service/NewRelic
    - tests/SprykerEcoTest/Zed/NewRelic

paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
settings:
    suite_class: \PHPUnit\Framework\TestCase
    colors: true
    memory_limit: 1024M
coverage:
    enabled: true
    whitelist: { include: ['src/*'] }
